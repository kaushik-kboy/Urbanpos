name: UrbanPOS Automated CI/CD Regression Guard

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pos-regression-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, bcmath
        coverage: none

    - name: Copy .env.example
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate Application Key
      run: php artisan key:generate --ansi

    - name: Create SQLite Database File
      run: |
        mkdir -p database
        touch database/database.sqlite
        echo "SQLite database file created at database/database.sqlite"

    - name: Run Database Migrations (Test DB)
      run: php artisan migrate --force --env=testing

    - name: Verify Blade Views Compilation
      run: php artisan view:cache

    - name: Run Core POS Regression Test Suite
      run: composer test-pos

    - name: Setup Node.js for Frontend Tests
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Node Dependencies
      run: npm ci --prefer-offline

    - name: Run Frontend JS Test Suite
      run: npm run test:frontend
